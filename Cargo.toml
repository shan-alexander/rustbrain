[workspace]
resolver = "2"
members = [
    "crates/rustbrain-core",
    "crates/rustbrain-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["rustbrain contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shan-alexander/rustbrain"
homepage = "https://github.com/shan-alexander/rustbrain"
documentation = "https://docs.rs/rustbrain-core"
readme = "README.md"
keywords = ["knowledge-graph", "markdown", "obsidian", "sqlite", "cli"]
categories = ["command-line-utilities", "text-processing", "database"]

[workspace.dependencies]
rustbrain-core = { version = "0.1.0", path = "crates/rustbrain-core" }

rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
jshift = "0.1"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
notify = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
tempfile = "3.15"
assert_cmd = "2.0"
predicates = "3.1"
