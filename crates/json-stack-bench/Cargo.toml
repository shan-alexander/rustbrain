[package]
name = "json-stack-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ad-hoc serde_json vs jshift benches for rustbrain-shaped workloads"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jshift = { version = "0.7", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "serde_vs_jshift"
harness = false
