[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Criterion benches for rustbrain (engine performance + serde vs jshift JSON stack)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jshift = { version = "0.7", features = ["derive"] }
rustbrain-core = { path = "../rustbrain-core" }
regex = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "serde_vs_jshift"
harness = false

[[bench]]
name = "rustbrain_performance"
harness = false
